<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="/css/layout.css">
    <link rel="stylesheet" type="text/css" href="/css/header_footer/header_footer.css">
    <link rel="stylesheet" type="text/css" href="/css/login_registration/login.css">
    
</head>
<body>
    <div class="container-fluid">
        <div class="login-container">
            <div class="login-box">
                <h1>Create account</h1>
                <form name="signin" method="post" action="/registration">
                    <input type="text" name="name" value="" placeholder="Name" required>
                    <input type="text" name="username" value="" placeholder="Username" required>
                    <input type="email" name="email" value="" placeholder="Email" required>
                    <input type="password" name="password" value="" placeholder="Password" required>
                    <button type="submit" name="Login">Log in</button>
                </form>
                <p>Already have an account? <a href="login-page.html">Log In</a></p>
            </div>
        </div>
    </div>
</body>
</html>

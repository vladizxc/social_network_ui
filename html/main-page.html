<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="/css/header_footer/header_footer.css">
    <link rel="stylesheet" type="text/css" href="/css/main/main.css">
    <link rel="stylesheet" type="text/css" href="/css/layout.css">
    <title>Document</title>

</head>
<body>
    <header class="container-fluid">
        <div class="container d-flex">
            
            <div class="left d-flex">
                
                <div class="logo">
                    <img src="/images/header_footer/logo.png" alt="">
                </div>
                
                <form name="search" action="search" method="post">
                    <div class="d-flex">
                        <input type="submit" name="search" value="">
                        <input name="search" type="text" placeholder="Search">
                    </div>
                </form>
                
            </div>
                
            <nav class="menu">
                <a class="active" href="/">Home</a>
                <a href="#">Friends</a>
                <a href="#">Messages</a>
                <a href="#">Notifications</a>
            </nav>

            <div class="account_logo">
                <img src="/images/header_footer/profile_logo.png" alt="">
            </div>
            
        </div>
    </header>
    <main class="container-fluid">
        <div class="container">
            <div class="block1 d-flex">
                <div class="left">
                <div class="profile">
                    <div>
                        <figure>
                            <img src="/images/header_footer/profile_logo.png" alt="">
                                <figcaption>
                                    <p class="name">Name Name</p>
                                    <p class="user_name">@username</p>
                                </figcaption>
                        </figure>
                        <div class="boxes d-flex">
                            <div class="box">
                                <p class="number">250</p>
                                <p class="caption">Post</p>
                            </div>
                            <div class="box">
                                <p class="number">2022</p>
                                <p class="caption">Followers</p>
                            </div>
                            <div class="box">
                                <p class="number">590</p>
                                <p class="caption">Following</p>
                            </div>
                        </div>
                        <button name="My Profyle" type="submit">My Profile</button>
                    </div>
                </div>
            </div>
            <div class="middle">
                <div class="new-post">
                    <div>
                        <div class="user-picture">
                            <img src="/images/header_footer/profile_logo.png" alt="">
                        </div>
                        <form name="post" action="new_post" method="post">
                            <div class="d-flex">
                                <input name="post" type="text" placeholder="Share something...">
                                <input name="post" type="submit" value="">
                            </div>
                            
                            <div>
                                <label for="file-upload" class="file-upload">
	                                <span><img src="/images/main/img_icon.png" alt="" width="20px"></span>
                                    </label>
                                    <input id="file-upload" type="file"/>
                                <select name="publicity">
                                    <option value="0">Public</option>
                                    <option value="1">Only Followers</option>
                                    <option value="2">Private</option>
                                </select>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
            
            
        </div>
    </main>
    <footer>

    </footer>
</body>
</html>

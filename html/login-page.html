<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="/css/layout.css">
    <link rel="stylesheet" type="text/css" href="/css/header_footer/header_footer.css">
    <link rel="stylesheet" type="text/css" href="/css/login_registration/login.css">
    <script src="/js/login.js" defer></script>
</head>
<body>
    <div class="container-fluid">
        <div class="login-container">
            <div class="login-box">
                <h1>Welcome Back</h1>
                <form id="login" name="login" method="post" action="/login">
                    <input type="text" name="username" value="" placeholder="Username" required>
                    <input type="password" name="password" value="" placeholder="Password" required>
                    <button type="submit" name="Login">Log in</button>
                </form>
                <p>First time here? <a href="registration.html">Create an account</a></p>
            </div>
        </div>
    </div>
</body>
</html>
